version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: docgen
    binary: docgen
    main: ./cmd/docgen
    targets:
      - windows_amd64_v1
      - linux_amd64_v1
      - darwin_arm64

archives:
  - id: docgen
    formats: ["zip"]
    files:
      - README.md
      - LICENSE
